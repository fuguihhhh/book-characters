const TOTAL=20,FLOOR=.01;let state=null;const $=s=>document.querySelector(s);const CIDX=Object.fromEntries(CHARACTERS.map((c,i)=>[c.id,i]));
function bytes(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function prep(q){if(!q._p){q._p=bytes(q.p64);q._c=bytes(q.c64)}return q}
function norm(o){let z=Object.values(o).reduce((a,b)=>a+b,0)||1;for(const k in o)o[k]/=z;return o}
function ent(v){return v.reduce((h,p)=>p>0?h-p*Math.log2(p):h,0)}
function rawLik(q,id,a){prep(q);const i=CIDX[id]*4,z=q._p[i]+q._p[i+1]+q._p[i+2]+q._p[i+3]||1;return q._p[i+a]/z}
function lik(q,id,a){prep(q);const cf=q._c[CIDX[id]]/255,raw=rawLik(q,id,a);return .25*(1-cf)+raw*cf}
function topCharacters(n=8){return Object.entries(state.p).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id,p])=>({c:CHARACTERS[CIDX[id]],p}))}
function pred(q){let d=[0,0,0,0];for(const[id,p]of Object.entries(state.p)){let l=[0,1,2,3].map(a=>lik(q,id,a)),z=l.reduce((a,b)=>a+b,0)||1;l=l.map(x=>x/z);for(let a=0;a<4;a++)d[a]+=p*l[a]}let z=d.reduce((a,b)=>a+b,0)||1;return d.map(x=>x/z)}
function expEnt(q){const pd=pred(q);let e=0;for(let a=0;a<4;a++){let n={};for(const[id,p]of Object.entries(state.p))n[id]=p*Math.max(FLOOR,lik(q,id,a));norm(n);e+=pd[a]*ent(Object.values(n))}return e}
function novelty(q){const recent=state.hist.slice(-5);let s=1;if(recent.some(x=>x.theme===q.theme))s-=.22;if(recent.at(-1)?.axis===q.axis)s-=.28;if(recent.some(x=>x.structure===q.structure))s-=.38;return Math.max(0,s)}
function challenge(q){const t=topCharacters(6);if(t.length<2)return 0;let s=0;for(let a=0;a<4;a++){let o=0,w=0;for(const x of t.slice(1)){o+=x.p*lik(q,x.c.id,a);w+=x.p}if(w)o/=w;s+=Math.abs(lik(q,t[0].c.id,a)-o)}return s/4}
function temperature(){return Math.max(.18,.72-.50*(state.hist.length/TOTAL))}
function choose(){const unused=QUESTIONS.filter(q=>!state.used.has(q.id)),h0=ent(Object.values(state.p)),lead=topCharacters(1)[0]?.p||0,rw=lead>.20?.40:lead>.12?.22:.08;let sc=unused.map(q=>{const ig=Math.max(0,h0-expEnt(q)),nv=novelty(q),ch=challenge(q);return{q,score:1.08*ig+.24*nv+rw*ch+(Math.random()-.5)*.04}}).sort((a,b)=>b.score-a.score);let pool=sc.slice(0,Math.min(12,sc.length)),mx=Math.max(...pool.map(x=>x.score)),tt=temperature(),ws=pool.map(x=>Math.exp((x.score-mx)/tt)),z=ws.reduce((a,b)=>a+b,0),r=Math.random(),acc=0;for(let i=0;i<pool.length;i++){acc+=ws[i]/z;if(r<=acc)return pool[i].q}return pool.at(-1).q}
function update(q,a){const n={};for(const[id,p]of Object.entries(state.p))n[id]=p*Math.max(FLOOR,lik(q,id,a));norm(n);state.p=n}
function render(q){state.q=q;state.used.add(q.id);$('#remaining').textContent=`还剩 ${TOTAL-state.hist.length} 道题`;$('#qt').textContent=q.title;$('#story').textContent=q.story;$('#bar').style.width=`${state.hist.length/TOTAL*100}%`;$('#choices').innerHTML='';q.choices.forEach((t,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${'ABCD'[i]}.</b>${t}`;b.onclick=()=>answer(i);$('#choices').appendChild(b)});$('#next').classList.add('hidden')}
function answer(a){const q=state.q;update(q,a);state.hist.push({qid:q.id,title:q.title,theme:q.theme,structure:q.structure,axis:q.axis,answer:a,choice:q.choices[a]});document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===a)b.classList.add('selected')});$('#remaining').textContent=`还剩 ${TOTAL-state.hist.length} 道题`;$('#next').textContent=state.hist.length>=TOTAL?'查看结果 →':'继续 →';$('#next').classList.remove('hidden')}
function next(){if(state.hist.length>=TOTAL)result();else render(choose())}
function pairScore(a,b,role){const x=a.rel,y=b.rel;if(role==='friend')return .28*y.warm+.26*y.steady+.28*y.loyal+.10*(1-Math.abs(x.playful-y.playful))+.08*(1-Math.abs(x.dominant-y.dominant));if(role==='lover')return .20*y.warm+.22*y.steady+.20*y.loyal+.20*y.intense+.10*(1-Math.abs(x.intense-y.intense))+.08*(1-Math.abs(x.dominant-y.dominant));if(role==='partner')return .25*y.judgment+.20*y.steady+.16*y.courage+.16*y.principled+.13*(1-Math.abs(x.dominant+y.dominant-.95))+.10*y.loyal;if(role==='mentor')return .30*y.judgment+.24*y.steady+.20*y.principled+.12*y.warm+.14*y.dominant;if(role==='rival')return .30*Math.abs(x.principled-y.principled)+.22*Math.abs(x.steady-y.steady)+.18*Math.abs(x.warm-y.warm)+.16*y.dominant+.14*y.intense;return 0}
function roleList(role){const anchors=topCharacters(8);return CHARACTERS.map(c=>{let s=0;for(const a of anchors)s+=a.p*pairScore(a.c,c,role);return{c,score:s}}).sort((a,b)=>b.score-a.score)}
function assignDistinct(w1,w2){const roles=['friend','lover','partner','mentor','rival'],used=new Set([w1.id,w2.id]),lists=Object.fromEntries(roles.map(r=>[r,roleList(r)])),out={};for(const r of roles){const x=lists[r].find(v=>!used.has(v.c.id));out[r]=x;used.add(x.c.id)}return out}
function roleWhy(role,anchor,c){const a=anchor.rel,r=c.rel;if(role==='friend')return r.loyal>.85?`${c.name}最适合作为朋友，不是因为与你最像，而是因为他/她在关系里更强调长期站在同伴身边；当你犹豫或改变方向时，这种稳定性会比性格相同更重要。`:`${c.name}与你的日常节奏并不完全一致，但这种差异反而减少正面碰撞；你更容易从这段友谊里得到补充，而不是另一个“复制的自己”。`;if(role==='lover')return r.intense>.68?`${c.name}与你之间更可能产生强烈吸引：关系不会只靠安全感维持，而会不断要求双方表达真实欲望、边界和选择。真正的难点也在这里——感情越强，越需要给彼此留下独立空间。`:`${c.name}更适合成为爱人，是因为这段关系的优势不在戏剧性，而在可持续：你们更容易把亲密、承诺和个人空间放在同一张桌上讨论，而不是靠一时冲动维持。`;if(role==='rival')return `${c.name}最可能成为你的对手，并不意味着你们一定互相厌恶。更可能的原因是：当规则、责任和个人判断发生冲突时，你们会把“什么应该优先”排在不同位置，因此越是重要的局面，分歧越难被简单妥协掉。`;if(role==='partner')return `${c.name}适合与你合作，因为他/她在判断、执行或风险控制上能补上你当前候选人物谱系里较弱的一侧；这种关系的价值主要来自分工，而不是性格相似。`;return `${c.name}适合作为导师，因为他/她更能在保持原则的同时提供稳定判断，不急着替你做决定，而是帮助你把代价和长期后果看得更清楚。`}
function evidenceFor(w){return state.hist.map(h=>{const q=QUESTIONS[+h.qid.slice(1)-1],v=rawLik(q,w.id,h.answer),avg=CHARACTERS.reduce((s,c)=>s+rawLik(q,c.id,h.answer),0)/CHARACTERS.length;return{...h,lift:v-avg}}).sort((a,b)=>b.lift-a.lift)}
function explain(w,second=false){const ev=evidenceFor(w),best=ev.slice(0,second?2:3),weak=[...ev].sort((a,b)=>a.lift-b.lift)[0];let text=best.map(x=>`在「${x.title}」里，你选择了“${x.choice}”`).join('；');return second?`${text}。这些选择让 ${w.name} 成为你的第二条相近路径，但你在其他情境中的取舍没有像第一位那样持续靠近他/她。`:`${text}。它们共同表现出一种稳定的选择方式，而不只是某个抽象性格标签。与此同时，在「${weak.title}」中你选择“${weak.choice}”，说明你并不是这个人物的复制品。`}
function storyText(w){const e=evidenceFor(w).slice(0,4).sort((a,b)=>state.hist.findIndex(h=>h.qid===a.qid)-state.hist.findIndex(h=>h.qid===b.qid)),a=e[0],b=e[1]||a,c=e[2]||b,d=e[3]||c;return `<h3>你与 ${w.name} 的一段平行小说</h3><p>你们在一座陌生城市相遇时，第一件真正需要决定的事来自「${a.title}」。你选择“${a.choice}”，而这也成了彼此认识的开始。</p><p>后来在「${b.title}」和「${c.title}」中，你们不再只是在旁观，而必须一起承担选择带来的后果。相似让你们容易理解彼此，差异则让故事没有变成两个人重复同一种答案。</p><p>直到「${d.title}」之后，你们才真正意识到：最接近一个文学人物，并不是每次作出同样选择，而是在一次次不同局面里，仍能认出对方坚持的理由。</p>`}
function result(){$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const t=topCharacters(8),w=t[0].c,s=t[1].c,roles=assignDistinct(w,s);$('#main').innerHTML=`<div class="resultIntro"><strong>最相近的人物</strong></div><div class="big">${w.name}</div><div class="muted">${w.book}</div><p>${w.note}</p><div class="second"><strong>第二相近</strong><div class="roleName">${s.name}</div><div class="muted">${s.book}</div><p>${explain(s,true)}</p></div>`;$('#why').innerHTML=`<h3>为什么会是 ${w.name}</h3><p>${explain(w)}</p>`;const labels={friend:'最适合做朋友',lover:'最适合成为爱人',partner:'最适合做合作伙伴',mentor:'最适合做导师',rival:'最可能成为对手'};$('#roles').innerHTML=Object.entries(roles).map(([k,x])=>`<div class="role"><h3>${labels[k]}</h3><div class="roleName">${x.c.name}</div><div class="muted">${x.c.book}</div><p>${roleWhy(k,w,x.c)}</p></div>`).join('');$('#storyResult').innerHTML=storyText(w)}
function begin(){const p={};CHARACTERS.forEach(c=>p[c.id]=1/CHARACTERS.length);state={p,hist:[],used:new Set()};$('#start').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');render(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)])}
$('#startBtn').onclick=begin;$('#next').onclick=next;$('#restart').onclick=()=>location.reload();</script></body></html>
