 $("#analysis").classList.remove("hidden");document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 state.pending=bestFollowUpFor(q);
 if(state.pending){$("#deepReason").textContent=state.pending.reason;$("#deepReason").classList.remove("hidden")}
 $("#next").disabled=true;$("#next").classList.remove("hidden");let left=READ_SECONDS;$("#next").textContent=`请先看分析… ${left}`;
 countdown=setInterval(()=>{left--;if(left>0)$("#next").textContent=`请先看分析… ${left}`;else{clearInterval(countdown);$("#next").disabled=false;$("#next").textContent=state.pending?"继续追问 →":"我看完了，下一题 →"}},1000)
}
function axisLabel(x){return({autonomy:"个人自由与关系/规则",compassion:"对陌生人的同情与自我保护",mercy:"宽恕与报复",sacrifice:"个人牺牲与结果收益",truth:"真相与承诺/关系",risk:"冒险与谨慎",loyalty:"忠诚与原则",attachment:"关系与自我道路",power:"权力与边界",authenticity:"真实感受与舒适",principle:"原则与现实代价",responsibility:"责任与个人机会",honesty:"诚实与保护他人"})[x]||x}
function done(){if(state.hist.length>=20)return true;if(state.hist.length<16)return false;const t=topCharacters(2);return t[0].p>.25&&(t[0].p-t[1].p)>.09}
function next(){
 if($("#next").disabled)return;
 if(state.pending){const q=state.pending.q;state.pending=null;state.followups++;render(q);return}
 if(done())result();else render(choose())
}
function pairScore(a,b,role){
 const x=a.rel,y=b.rel;
 if(role==="friend")return .28*y.warm+.26*y.steady+.28*y.loyal+.10*(1-Math.abs(x.playful-y.playful))+.08*(1-Math.abs(x.dominant-y.dominant));
 if(role==="lover")return .20*y.warm+.22*y.steady+.20*y.loyal+.20*y.intense+.10*(1-Math.abs(x.intense-y.intense))+.08*(1-Math.abs(x.dominant-y.dominant));
 if(role==="partner")return .25*y.judgment+.20*y.steady+.16*y.courage+.16*y.principled+.13*(1-Math.abs(x.dominant+y.dominant-.95))+.10*y.loyal;
 if(role==="mentor")return .30*y.judgment+.24*y.steady+.20*y.principled+.12*y.warm+.14*y.dominant;
 if(role==="rival")return .30*Math.abs(x.principled-y.principled)+.22*Math.abs(x.steady-y.steady)+.18*Math.abs(x.warm-y.warm)+.16*y.dominant+.14*y.intense;
 return 0
}
function roleList(role){
 const anchors=topCharacters(8);
 return CHARACTERS.map(c=>{let s=0;for(const a of anchors)s+=a.p*pairScore(a.c,c,role);return{c,score:s}}).sort((a,b)=>b.score-a.score)
}
function assignDistinct(winner){
 const roles=["friend","lover","partner","mentor","rival"],used=new Set([winner.id]),lists=Object.fromEntries(roles.map(r=>[r,roleList(r)])),out={};
 while(Object.keys(out).length<roles.length){let br=null,bc=null,bm=-Infinity;for(const r of roles.filter(x=>!out[x])){const av=lists[r].filter(x=>!used.has(x.c.id));const margin=(av[0]?.score??0)-(av[1]?.score??0);if(margin>bm){bm=margin;br=r;bc=av[0]}}out[br]=bc;used.add(bc.c.id)}
 return out
}
function confidenceLabel(v){
 if(v>=.72)return "高置信匹配";
 if(v>=.50)return "中等置信匹配";
 return "低置信推断"
}
function pivotalFor(winner){
 const rows=state.hist.map((h,index)=>{
   const q=[...QUESTIONS,...FOLLOWUPS].find(x=>x.id===h.qid);
   const pw=rawLik(q,winner.id,h.answer),avg=h.rawAvg||.25,cf=q.conf[winner.id]??.4;
   const lift=pw/(avg||.25);
   const evidence=(pw-avg)*(.45+.55*cf);
   return {...h,index,pw,avg,cf,lift,evidence,label:confidenceLabel(cf)}
 });
 const support=[...rows].sort((a,b)=>b.evidence-a.evidence).slice(0,4);
 const difference=[...rows].sort((a,b)=>(a.pw*a.cf)-(b.pw*b.cf))[0];
 const chronological=[...support].sort((a,b)=>a.index-b.index);
 return {support,difference,chronological}
}
function storyText(winner,piv){
 const e=piv.chronological.length?piv.chronological:[piv.difference];
 const a=e[0],b=e[1]||e[0],c=e[2]||e[0],d=e[3]||piv.difference||e[0];
 const verbs=[
  "你先做出了决定，代价并没有立刻显现。",
  "你没有把判断交给别人，而是选择承担后果。",
  "你把一个具体的人放到了抽象规则之前。",
  "你没有选最舒服的出口，而是保留了继续改变局面的可能。"
 ];
 return `<h3>你与 ${winner.name} 的一段平行小说</h3>
 <p>你和 ${winner.name} 在一座没有名字的旧图书馆醒来。桌上只有一本会自己翻页的书。第一页写着<strong>「${a.title}」</strong>。门随即在墙上出现，而你说：“${a.choice}” ${verbs[a.answer%4]} ${winner.name}没有评价，只把门推开。</p>
 <p>门后不是走廊，而是另一个世界。你们很快又被卷进<strong>「${b.title}」</strong>。这一次你选择“${b.choice}”。${winner.name}第一次与你争论：不是因为你们完全相反，而是因为相似的人往往更清楚对方的决定会付出什么。</p>
 <p>第三扇门最难。那是<strong>「${c.title}」</strong>。你仍然按照自己的方式行动：“${c.choice}”。此时你们已经不再试图证明谁更正确，而是开始分工——一个人看风险，一个人看不能失去的东西。</p>
 <p>回到图书馆前，书又翻到<strong>「${d.title}」</strong>。这是你和 ${winner.name} 最不像的一次。你选择“${d.choice}”。他/她没有跟着你做同样的决定，却仍然和你一起走出了最后一道门。</p>
 <p>天亮时，书的最后一页只留下一句话：<strong>真正相像的人，并不是每次都作出同一个选择，而是在不同选择之后，仍能理解彼此为什么那样做。</strong></p>`
}
function spectrumSummary(t){
 const gap=(t[0]?.p||0)-(t[1]?.p||0);
 if(gap<.035){
   return `<div class="spectrum"><strong>你不是一个单点结果。</strong><br>你的核心谱系目前落在 ${t[0].c.name} × ${t[1].c.name} × ${t[2].c.name} 之间。第一名只是当前概率略高，而不是“唯一正确答案”。</div>`
 }
 if(gap<.08){
   return `<div class="spectrum"><strong>核心人物：${t[0].c.name}</strong><br>但 ${t[1].c.name} 与 ${t[2].c.name} 仍构成明显的次人物谱系。</div>`
 }
 return `<div class="spectrum"><strong>核心人物较清晰：${t[0].c.name}</strong><br>${t[1].c.name} 与 ${t[2].c.name} 是与你相邻的两种文学路径。</div>`
}
function result(){
 $("#quiz").classList.add("hidden");$("#result").classList.remove("hidden");
 const t=topCharacters(8),winner=t[0].c,roles=assignDistinct(winner),piv=pivotalFor(winner);
 $("#main").innerHTML=spectrumSummary(t)+`<div class="big">${winner.name}</div><div class="muted">${winner.book}</div><p>${winner.note}</p>`+
 t.map((x,i)=>`<div class="rank"><span>${i+1}. ${x.c.name}</span><strong>${(x.p*100).toFixed(1)}%</strong></div>`).join("");
 $("#why").innerHTML=`<h3>为什么会靠近 ${winner.name}</h3>
 <p class="muted">下面的“置信”指这个人物在该具体情境中的模型依据强度，不等于小说原文对该现代情境有直接答案。</p>`+
 piv.support.map(x=>`<div class="evidence"><strong>${x.title}</strong> · <span class="confidence">${x.label}</span><br>你选择了“${x.choice}”。这一选择对 ${winner.name} 的支持度高于全人物平均，而且该题对这个人物的置信度为 ${(x.cf*100).toFixed(0)}%。</div>`).join("")+
 `<div class="difference"><strong>你们最明显的分岔：</strong><br>在「${piv.difference.title}」中，你选择“${piv.difference.choice}”。这说明“最像”不是复制，你仍然保留了自己的条件性判断。</div>`;
 const labels={friend:"最适合做朋友",lover:"最适合成为爱人",partner:"最适合做合作伙伴",mentor:"最适合做导师",rival:"最可能成为对手"};
 $("#roles").innerHTML=Object.entries(roles).map(([k,x])=>`<div class="role"><h3>${labels[k]}</h3><div class="roleName">${x.c.name}</div><div class="muted">${x.c.book}</div></div>`).join("");
 $("#storyResult").innerHTML=storyText(winner,piv);
 $("#path").textContent=`本次经历 ${state.hist.length} 个选择，其中 ${state.followups} 次为动态追问。系统只把“同一价值冲突 + 相近情境下的反向选择”视为真正矛盾；如果你只是在不同环境里改变做法，会记录为情境依赖，而不是判成前后不一致。人物匹配直接使用“具体人物 × 具体情境 × 选项概率 × 独立置信度”，不先把你转成 MBTI 或固定人格类型。`
}
function begin(){
 const p={};CHARACTERS.forEach(c=>p[c.id]=1/CHARACTERS.length);
 state={p,hist:[],used:new Set(),usedFamilies:new Set(),meta:null,pending:null,followups:0};
 $("#start").classList.add("hidden");$("#result").classList.add("hidden");$("#quiz").classList.remove("hidden");
 const starters=QUESTIONS.filter(q=>[0,1,5,8,10,13,18,20].includes(q.family));
 render(starters[Math.floor(Math.random()*starters.length)])
}
$("#startBtn").onclick=begin;$("#next").onclick=next;$("#restart").onclick=()=>location.reload();
</script></body></html>
