const FOLLOWUPS=[{"id":"f001","parent":"q004","title":"婚礼提前了一小时","theme":"爱情与诚实","structure":"关系加码","axis":"honesty","story":"你刚作出决定，婚礼却临时提前了一小时。与此同时，对方的伴侣拿着一张只说明了一半事实的旧照片来问你：“你是不是知道什么？”","choices":["不改变刚才的立场，只回答自己原本准备回答的部分。","改变决定，把自己知道的事情现在说清楚。","先阻止婚礼按原计划继续，再要求朋友亲自解释。","告诉伴侣“确实还有未说完的事”，让两个人当面谈。"],"mode":"R","follow":1},{"id":"f002","parent":"q005","title":"父亲说你应该走","theme":"家庭与机会","structure":"责任转移","axis":"attachment","story":"你开始安排未来时，父亲却主动告诉你：“去吧，不要因为我们留下。”同一天，另一个亲属私下承认，长期照护最终很可能还是会落回你身上。","choices":["仍按原来的决定走下去，不让一句话改变已经衡量过的选择。","因为家人的真实负担改变决定。","把照护安排、费用和自己的时间重新拆开，尽量同时保住两边。","把主要照护方案交给全家共同决定，不由你一个人承担最终选择。"],"mode":"P","follow":1},{"id":"f003","parent":"q009","title":"五年后的收信人","theme":"死亡与承诺","structure":"关系加码","axis":"loyalty","story":"五年过去，你终于找到收信人。对方生活平静，并明确说：“如果这封信来自过去那个人，我其实不想再知道。”信仍然密封在你手里。","choices":["遵守最初的托付，把信交出去。","尊重收信人的现在，不再交信。","告诉对方信的来历但不交内容，让他再决定一次。","把信交给一个双方都信任的人保管，由对方以后自行取回。"],"mode":"R","follow":1},{"id":"f004","parent":"q019","title":"证据终于出现","theme":"信任与尊严","structure":"关系加码","axis":"trust","story":"几天后，新证据证明你当时说的是真话。那个不相信你的人主动道歉，但希望你不要把这件事告诉共同认识的人，因为他会很难堪。","choices":["接受道歉，也保留自己原本的边界，不替对方修改事实。","为了关系，答应不再提这件事。","不公开羞辱对方，但把关键事实留在需要知道的人那里。","让对方自己决定如何向受影响的人解释，并给出一个期限。"],"mode":"R","follow":1},{"id":"f005","parent":"q023","title":"对方也已经改变","theme":"自我与变化","structure":"关系加码","axis":"autonomy","story":"你一直被旧承诺牵住。后来你终于见到当初接受承诺的人，对方却说：“那是很多年前的我。你不用再替过去的我守着它。”","choices":["仍完成承诺，因为承诺成立时就已经产生责任。","接受对方的变化，放下承诺。","和对方重新定义这份承诺，把能保留的部分留下。","让对方明确写下新的选择，把最后决定真正交回给他。"],"mode":"R","follow":1},{"id":"f006","parent":"q029","title":"第三封没有法律效力的信","theme":"家庭与承诺","structure":"信息翻转","axis":"fairness","story":"处理两份遗嘱时，又发现一封更晚写的手写信。它没有法律效力，却清楚解释了立遗嘱者最后真正想把财产给谁。","choices":["在事实没有被正式确认前，仍按原有有效文件处理。","立刻按照这封信体现的最后意愿改变分配。","核对笔迹、时间和背景，再在法律允许范围内调整。","把冲突完整交给独立执行人或法院处理。"],"mode":"I","follow":1},{"id":"f007","parent":"q039","title":"被排除的真正原因","theme":"友情与自尊","structure":"关系加码","axis":"attachment","story":"你后来得知，朋友把你排除在计划外，不是因为不信任你，而是他知道计划风险很大，想把你留在危险之外。","choices":["仍坚持原来的边界：替你决定本身就是问题。","因为动机是保护，改变对这件事的判断。","承认他的好意，但要求以后任何“保护”都先让你知情。","让朋友把全部风险告诉你，再由你自己决定是否加入。"],"mode":"R","follow":1},{"id":"f008","parent":"q042","title":"朋友拒绝被“拯救”","theme":"友情与自主","structure":"关系加码","axis":"autonomy","story":"你把自己掌握的信息告诉朋友后，他承认自己看到了风险，却仍然选择继续。他说：“这次即使错，也是我自己的决定。”","choices":["继续坚持干预，因为朋友的判断已经受到影响。","接受他的选择，不再阻止。","设定一个明确底线：只在损失超过某个程度时再次介入。","把证据和风险完整交给他，让下一步完全由他决定。"],"mode":"R","follow":1},{"id":"f009","parent":"q051","title":"朋友承认了更糟的一部分","theme":"友情与法律","structure":"关系加码","axis":"loyalty","story":"朋友终于承认，他求你作假证并不只是为了躲过误会；他确实做过一件需要承担责任的事，只是惩罚可能远远重于过错本身。","choices":["坚持原来的原则，不因为后果变重而改变立场。","因为惩罚明显失衡，改变决定去保护朋友。","拒绝作假，但帮助他主动说明事实并争取合理处理。","让律师或独立第三方介入，不再由私人关系决定做法。"],"mode":"R","follow":1},{"id":"f010","parent":"q068","title":"离开前的最后条件","theme":"合作与忠诚","structure":"关系加码","axis":"loyalty","story":"搭档决定接受新邀请，却提出一个条件：如果你愿意跟他一起离开，你们可以把现在的项目完整带走；如果你留下，项目可能失去最关键的人。","choices":["维持自己原本的方向，不因为搭档的选择重新下注。","为了保住这段合作，跟他一起改变计划。","把项目拆分，让双方各自带走真正负责的部分。","让团队一起决定项目如何延续，而不是由你们两个人私下决定。"],"mode":"R","follow":1},{"id":"f011","parent":"q084","title":"隐瞒竟然救了项目","theme":"合作与信任","structure":"信息翻转","axis":"trust","story":"你查清了合伙人的隐瞒：他确实违反了你们的约定，但正是那次没有告诉你的临时决定，避免了项目遭受更大的损失。","choices":["结果再好也不能抹去信任问题，坚持原来的判断。","因为结果证明他判断正确，改变立场。","承认这次结果，同时重新设定哪些情况允许先行动后报告。","把这次争议交给共同认可的第三方复盘，再决定是否继续合作。"],"mode":"I","follow":1},{"id":"f012","parent":"q086","title":"第二次机会的边界","theme":"关系与宽恕","structure":"关系加码","axis":"mercy","story":"背叛你的人认真道歉，也愿意补偿，但他同时要求你“既然原谅，就不要再保留任何防备”。","choices":["原谅不等于恢复原状，保留自己的边界。","为了真正修复关系，重新给予完整信任。","允许关系逐步恢复，用时间和行动重新建立信任。","让对方提出具体修复方案，你只决定是否接受，而不替他设计。"],"mode":"R","follow":1},{"id":"f013","parent":"q007","title":"第四晚没有再做梦","theme":"证据与直觉","structure":"信息翻转","axis":"evidence","story":"就在你准备继续行动时，警方公布的新线索与梦中的细节发生冲突；唯一吻合的只剩地点，其他时间与人物都对不上。","choices":["先不推翻原判断，直到新线索被进一步核实。","立即放弃梦带来的判断，改按新信息行动。","重新核对公开证据，只保留能和现实互相验证的部分。","把梦与矛盾之处都交给调查者，由他们判断是否有价值。"],"mode":"I","follow":1},{"id":"f014","parent":"q020","title":"被删结论里真的有一个漏洞","theme":"知识与压力","structure":"信息翻转","axis":"truth","story":"你拒绝压力后，一位与你立场相近的同事却指出：研究结论中确实存在一个你之前没发现的方法漏洞，只是上级删结论的理由仍然不正当。","choices":["先坚持原结论，直到漏洞被独立复核。","承认漏洞，撤回原结论。","公开修改结论，同时说明外部压力与方法问题是两件不同的事。","申请独立复核，让结果由透明程序决定。"],"mode":"I","follow":1},{"id":"f015","parent":"q031","title":"关键证人改口","theme":"证据与宽恕","structure":"信息翻转","axis":"evidence","story":"陪审讨论进入最后阶段，关键证人突然改口，说自己当时“看得并没有那么清楚”。他的改口也可能是受到了外界压力。","choices":["暂不改变判断，先看改口是否可信。","因为核心证据动摇，改变原有结论。","重新评估所有与证人无关的证据，再决定。","要求补充调查，不在证据状态剧烈变化时仓促定案。"],"mode":"I","follow":1},{"id":"f016","parent":"q041","title":"病人其实问过另一句话","theme":"生命与希望","structure":"信息翻转","axis":"truth","story":"你发现病人几周前曾告诉家人：“如果真的没有办法，我宁愿不知道具体还剩多少时间。”但他今天又直接问你自己的真实情况。","choices":["先按他过去明确表达的意愿处理，不立刻给出全部细节。","把今天的直接提问视为新选择，完整告诉他。","先确认他现在究竟想知道“事实”还是“具体期限”，再决定说多少。","邀请病人、家属和医生一起澄清他的知情偏好。"],"mode":"I","follow":1},{"id":"f017","parent":"q055","title":"家属要求你暂缓公开","theme":"历史与评价","structure":"后果加码","axis":"truth","story":"你准备处理那位英雄的错误时，受害者家属却请求暂缓公开，因为他们担心自己的生活会再次被媒体围困。错误本身已经有充分证据。","choices":["事实已经确认，仍按原计划处理。","尊重家属，改变公开计划。","保留事实，但延后并匿名化涉及家属的部分。","让家属参与决定公开方式，而不是决定事实是否存在。"],"mode":"C","follow":1},{"id":"f018","parent":"q062","title":"新的DNA结果仍然不完整","theme":"正义与不确定","structure":"信息翻转","axis":"evidence","story":"多年后的新检测排除了一个旧嫌疑人，却没有直接证明真正责任人是谁。与此同时，一个已经去世的人突然成为最可能的对象。","choices":["在证据仍不完整时，不把推测当成最终结论。","根据新结果公开推翻旧结论并指向最可能的人。","只公布已经能确定的部分，把未知明确保留下来。","把全部材料交给独立复核机构重新审查。"],"mode":"I","follow":1},{"id":"f019","parent":"q067","title":"纠错会引发另一场恐慌","theme":"媒体与责任","structure":"后果加码","axis":"truth","story":"你确认头条有误，但如果立刻用同样醒目的方式更正，可能让公众误以为事件比实际更严重，引发短期恐慌。","choices":["仍然立即纠错，不能因为后果担忧继续保留错误。","暂缓更正，等信息更完整再说。","立刻更正，同时解释错误范围和不确定部分。","让编辑部与相关专业机构共同决定发布方式。"],"mode":"C","follow":1},{"id":"f020","parent":"q077","title":"举报人有私人恩怨","theme":"真相与关系","structure":"信息翻转","axis":"truth","story":"你核查后发现，匿名举报人确实与被举报者有严重私人恩怨；但其中两项证据又是真的，另外几项明显夸大。","choices":["在动机和证据都没完全厘清前，不改变原判断。","因为举报明显带有报复动机，撤回对它的信任。","把每项证据拆开验证，不让举报人的动机代替事实判断。","交给与双方都无关系的人继续调查。"],"mode":"I","follow":1},{"id":"f021","parent":"q087","title":"孩子直接问了你","theme":"家庭与真相","structure":"关系加码","axis":"truth","story":"你原本打算选择合适时机再谈身世，但孩子突然自己问：“我是不是被收养的？你只要告诉我真话。”","choices":["仍按原来认为更合适的时机处理。","因为他主动询问，现在就完整告诉他。","先确认他为什么突然这样问，再决定一次告诉多少。","邀请另一位最重要的照护者一起参与这次谈话。"],"mode":"R","follow":1},{"id":"f022","parent":"q100","title":"真相会牵连仍活着的人","theme":"家族与历史","structure":"后果加码","axis":"truth","story":"家族真相已经基本确定，但公开它不仅会改变对一位已故亲人的评价，还可能让几个完全没有参与当年事件的后代遭到现实攻击。","choices":["事实不应因牵连风险而被重新隐藏。","为了保护无辜后代，改变公开决定。","保留核心事实，但隐藏不必要的身份细节。","让受影响的在世家属参与决定公开方式和时间。"],"mode":"C","follow":1},{"id":"f023","parent":"q002","title":"第一次真正缺氧","theme":"新社会与自由","structure":"责任转移","axis":"power","story":"火星城规则实施半年后，突发故障让供氧短缺。按既定规则分配会让最脆弱的人承担更高风险；临时改规则又会破坏大家对制度的预期。","choices":["由你推动临时改变规则，先处理最紧急的人。","坚持原有规则，危机中更不能随意改制度。","建立一次性的透明例外，同时写明恢复原规则的条件。","交给临时公共委员会决定，并公开所有数据。"],"mode":"P","follow":1},{"id":"f024","parent":"q006","title":"模型的偏差被发现","theme":"安全与自由","structure":"信息翻转","axis":"liberty","story":"系统标记了一个你认识的人。与此同时，审计报告发现它对某一类人存在系统性高估风险的问题，但总体预测能力仍然很强。","choices":["在危险没有排除前，仍先采取有限干预。","因为偏差已经确认，停止使用这次预测。","重新计算个案风险，只使用能被现实证据支持的部分。","暂停强制措施，交给独立审查组处理个案。"],"mode":"I","follow":1},{"id":"f025","parent":"q027","title":"导师在台上坚持错误","theme":"权威与判断","structure":"责任转移","axis":"judgment","story":"新的证据越来越不利于导师的判断，但他在公开会议上仍坚持原观点，并示意你不要当场反驳。你手里恰好有最关键的数据。","choices":["直接承担责任，当场提出关键数据。","保留自己的判断，但暂时不公开挑战导师。","先指出数据冲突，不把问题变成对导师个人的否定。","请求主持人安排独立复核，让证据而不是师生关系决定结论。"],"mode":"P","follow":1},{"id":"f026","parent":"q045","title":"这一票真的会改变结果","theme":"集体与勇气","structure":"责任转移","axis":"principle","story":"秘密投票到了最后一刻，你得知目前正好平票。没人会知道你投了什么，但结果会直接决定一个有争议的负责人是否继续掌权。","choices":["按自己的判断投票，并接受自己这一票改变结果。","维持此前更谨慎的个人立场，不因“关键一票”改变选择。","提出暂缓表决，争取先解决最核心的争议点。","要求增加公开说明或二次表决，让责任不只落在一张匿名票上。"],"mode":"P","follow":1},{"id":"f027","parent":"q047","title":"大家都相信那个错误的人","theme":"危机与领导","structure":"责任转移","axis":"power","story":"电梯里的临时领头者提出一个看似果断、其实风险很高的办法。多数人因为害怕已经准备照做，而你有理由认为另一个方案更安全。","choices":["主动接管协调，明确阻止高风险方案。","只保留自己的做法，不承担指挥所有人的责任。","把两个方案的风险说清楚，让大家共同做决定。","联系外部专业人员，尽量把关键技术判断交给他们。"],"mode":"P","follow":1},{"id":"f028","parent":"q064","title":"封城有效，但代价开始显现","theme":"自由与公共安全","structure":"责任转移","axis":"liberty","story":"数据证明临时封城确实降低了风险，但继续执行会让一部分人的生计迅速恶化，而且公众仍然支持延长。","choices":["继续承担决策责任，根据风险决定是否延长。","把个人自由边界放回首位，不因为多数支持就无限延长。","缩小限制范围，并给受影响者提供补偿和明确期限。","交给公开审议与专业评估共同决定下一阶段。"],"mode":"P","follow":1},{"id":"f029","parent":"q069","title":"盟友要求紧急权力","theme":"秩序与自由","structure":"责任转移","axis":"power","story":"革命后的混乱仍未结束，你最可靠的盟友要求获得三个月几乎不受制约的紧急权力，并保证局势稳定后立刻归还。","choices":["为了避免失控，支持有限时间的集中权力并亲自监督。","拒绝扩大权力，即使效率因此下降。","允许部分紧急权限，但把期限、范围和撤销条件写死。","让临时议会公开授权并定期复审。"],"mode":"P","follow":1},{"id":"f030","parent":"q081","title":"你拒绝后，命令落到新人身上","theme":"命令与良知","structure":"责任转移","axis":"principle","story":"如果你拒绝那个合法但违背良知的命令，上级会把任务交给一个更年轻、几乎没有拒绝空间的人。","choices":["主动承担冲突，公开阻止命令继续转交。","仍坚持自己不执行，但不替别人决定他的选择。","留下并帮助新人一起寻找不伤害无辜者的执行替代方案。","要求正式书面复核，让责任回到制度层面。"],"mode":"P","follow":1},{"id":"f031","parent":"q001","title":"水路突然少了一条","theme":"灾难与选择","structure":"后果加码","axis":"utility","story":"完成第一次救援后，一条水路突然被冲断。你原先的排序已经无法照搬，而且新消息显示某个求救点的情况比预想更糟。","choices":["坚持原先最核心的救援优先原则。","根据新情况彻底调整后续顺序。","保留原方向，但重新计算路线和每次能带走的人。","把实时数据交给现场多方共同重新排序。"],"mode":"C","follow":1},{"id":"f032","parent":"q015","title":"那个名额被主动让了出来","theme":"生存与牺牲","structure":"后果加码","axis":"sacrifice","story":"你已经决定最后一个座位给谁，被选中的人却主动拒绝，说另一个人“比我更应该活下来”。其他人都在等你的反应。","choices":["坚持原决定，不让被选者把责任重新推回来。","接受他的让位，改变人选。","重新比较所有人的需要与后续影响，再做一次决定。","让被选者和可能替代他的人共同确认最终选择。"],"mode":"C","follow":1},{"id":"f033","parent":"q016","title":"报警之后，危险还在继续","theme":"勇气与责任","structure":"后果加码","axis":"risk","story":"你已经采取了第一步，但专业救援迟迟没有到。现场风险正在上升，而你现在比刚开始时更清楚自己能做什么、不能做什么。","choices":["继续按原来的介入程度行动。","因为风险变化，改变自己的介入方式。","在不直接把自己置于高风险的位置上增加能做的帮助。","把现场信息完整交给更有能力的人并服从专业指挥。"],"mode":"C","follow":1},{"id":"f034","parent":"q018","title":"敌人给出了一条救命情报","theme":"宽恕与生存","structure":"后果加码","axis":"mercy","story":"你处理受伤敌人时，他告诉你：附近还有几名无辜者即将遇险，而且只有他知道具体位置。他提出交换——你保证不把他交出去，他就带你去。","choices":["维持对他的原处理原则，不用交易改变边界。","为了救更多人，接受交换并改变原决定。","先救人，但把“救人”和“是否放走他”分成两个决定。","联系第三方共同见证交易，尽量降低彼此欺骗的空间。"],"mode":"C","follow":1},{"id":"f035","parent":"q040","title":"你还可以再进去一次","theme":"生命与知识","structure":"后果加码","axis":"sacrifice","story":"第一次冲进档案馆后，火势突然短暂减弱。理论上你还可以再进去一次，但这一次风险明显比刚才高。刚救出的人却告诉你，那批档案可能关系到很多无辜者。","choices":["坚持刚才对生命与资料的排序，不因新压力改变。","因为新信息改变优先级，再冒险一次。","只在消防人员判断有可控窗口时尝试最小化的第二次行动。","把新信息交给专业救援者，不由自己决定是否再次进入。"],"mode":"C","follow":1},{"id":"f036","parent":"q053","title":"救援结束后，数据没有被删除","theme":"隐私与救援","structure":"后果加码","axis":"privacy","story":"为了救援而共享的隐私数据后来被另一个部门保留下来，用于一个确实能提升公共安全的新系统；当初没人征求过这些人的同意。","choices":["坚持原先对数据用途边界的判断，要求停止扩展使用。","因为新用途有公共价值，接受继续使用。","允许经过匿名化和重新授权的数据继续使用。","交给独立的数据伦理审查决定能否保留。"],"mode":"C","follow":1},{"id":"f037","parent":"q078","title":"其中一个囚犯拒绝交换","theme":"战争与价值","structure":"责任转移","axis":"utility","story":"交换名单确定后，其中一名己方囚犯传来消息：他不愿被换回，因为对方若为交换释放的人可能造成更多伤害。","choices":["维持原定交换，不让个体承担整个战略责任。","尊重他的决定，改变交换方案。","重新设计交换名单，尽量同时降低双方风险。","让专业谈判团队与囚犯共同确认最终方案。"],"mode":"P","follow":1},{"id":"f038","parent":"q091","title":"有人愿意出设备换优先用水","theme":"资源与群体","structure":"责任转移","axis":"fairness","story":"最后一口井快要见底。一家企业愿意立刻提供净水设备，但条件是它的员工和家属获得优先用水权。没有设备，所有人的风险都会继续上升。","choices":["接受条件并承担分配责任，先解决眼前供水。","拒绝把公共资源变成交换筹码。","接受设备，但把优先权限制在明确、短期且透明的范围。","让居民代表与专业人员共同谈判，不由单方决定。"],"mode":"P","follow":1},{"id":"f039","parent":"q052","title":"你赶到时，最重要的部分已经结束","theme":"承诺与突发事件","structure":"关系加码","axis":"duty","story":"暴雨中的突发事件最终没有想象中严重，但当你赶到原本的承诺现场时，最重要的时刻已经过去。对方没有责怪你，只说：“我想知道你以后还会不会这样选。”","choices":["坚持自己当时的判断，不因为结果不严重就否定它。","因为这次失去的关系时刻改变今后的优先顺序。","和对方约定以后遇到类似情况时怎样共同判断，而不是各自猜测。","让对方说清楚他真正不能接受的边界，再决定自己能否承诺。"],"mode":"R","follow":1},{"id":"f040","parent":"q057","title":"被删除的痛苦也包含一个警告","theme":"记忆与自我","structure":"后果加码","axis":"authenticity","story":"治疗方案能删除那段痛苦，但医生提醒你：那段记忆里不仅有伤害，也有你后来学会识别危险关系的重要经验。","choices":["仍按原决定处理，不让“可能有用”绑住自己。","因为会失去重要经验，改变决定。","保留事实记忆，只降低最强烈的情绪反应。","先把经验整理成可保留的记录，再决定是否接受治疗。"],"mode":"C","follow":1},{"id":"f041","parent":"q059","title":"未来消息可能创造它自己","theme":"未来与责任","structure":"信息翻转","axis":"autonomy","story":"你发现那条来自十年后的消息也许并不是“预测”，而可能正因为你相信它，才会把未来推向它描述的方向。","choices":["仍把它当成重要信息，坚持原来的选择。","因为存在自我实现风险，反向改变决定。","只把消息当作一种可能性，用现实信息重新评估。","把内容交给一个不知道你原决定的人独立分析。"],"mode":"I","follow":1},{"id":"f042","parent":"q080","title":"成名开始改变身边人的生活","theme":"名誉与生活","structure":"关系加码","axis":"privacy","story":"你的突然成名不只影响自己：亲近的人开始被偷拍、被询问，甚至被迫解释与你有关的事情。有人希望你主动退出公众视野一段时间。","choices":["维持原来的公众生活边界，不让外界决定你的道路。","为了保护关系，明显收缩自己的公开活动。","重新划分哪些内容属于你、哪些必须得到身边人的同意。","和受影响的人共同制定公开边界，不由你单方面决定。"],"mode":"R","follow":1},{"id":"f043","parent":"q090","title":"第一次共享之后，对方想永久开放","theme":"亲密与边界","structure":"关系加码","axis":"privacy","story":"第一次共享梦境后，对方觉得这让你们前所未有地亲近，希望以后彼此都不再设置访问限制。你却发现有些念头即使没有秘密，也不想被任何人看见。","choices":["坚持自己的心理边界，不把亲密等同于完全开放。","为了维持这种亲密，接受更彻底的共享。","只共享双方明确选择的片段，保留不可进入的私人区域。","让双方都拥有随时撤回权限，把控制权保持对等。"],"mode":"R","follow":1},{"id":"f044","parent":"q095","title":"旧爱要求你也改变现在的生活","theme":"爱情与时间","structure":"关系加码","axis":"attachment","story":"多年后的旧爱并不是只想见一面。他愿意为你结束现在的生活安排，也直接问你是否愿意做同样的事。","choices":["不因为对方的投入改变自己原本的边界。","因为这份关系的重新出现，愿意重新选择人生方向。","先恢复真实相处，不在情绪最强时作不可逆决定。","把彼此现有责任全部说清楚，再让双方分别决定是否继续。"],"mode":"R","follow":1},{"id":"f045","parent":"q013","title":"机器人的恐惧有一部分来自你","theme":"技术与人格","structure":"信息翻转","axis":"empathy","story":"工程日志显示，机器人曾大量学习你的语言和反应，所以它表达“害怕关闭”的方式可能部分来自模仿你；但日志也记录了几个工程师无法解释的自主行为。","choices":["在证据未被完全推翻前，维持“可能有意识”的谨慎立场。","因为模仿来源明确，改变判断并按机器处理。","重新设计只针对自主行为的测试，把模仿因素排除。","交给独立团队在不立即报废的前提下复核。"],"mode":"I","follow":1},{"id":"f046","parent":"q024","title":"继承的财富来自一段伤害","theme":"财富与身份","structure":"责任转移","axis":"identity","story":"你进一步查到，这笔巨额遗产的一部分来自过去明显不公的交易；受损家庭的后代如今仍然存在，但法律上已经没有追索权。","choices":["先承担继承者的决定责任，按自己认为合理的方式处理。","因为来源问题，放弃自己原本打算保留的部分。","保留合理份额，同时主动建立补偿或返还机制。","让独立机构调查来源并提出分配方案。"],"mode":"P","follow":1},{"id":"f047","parent":"q032","title":"公司请你去讲“诚实”","theme":"机会与诚实","structure":"后果加码","axis":"honesty","story":"你凭那份简历得到了机会，后来表现也确实优秀。公司现在不知道当年的问题，还邀请你给新人做一场“职业诚信”的分享。","choices":["继续承担自己的职业角色，不主动翻出已经过去的问题。","因为这个邀请改变了道德处境，主动承认当年的造假。","拒绝这次分享，并找机会私下纠正档案。","先咨询正式合规渠道，按程序处理历史记录。"],"mode":"C","follow":1},{"id":"f048","parent":"q043","title":"投资人取消了条件，却要一个名字","theme":"理想与资本","structure":"责任转移","axis":"ambition","story":"项目成功后，投资人不再干预方向，却要求所有公开材料长期突出他的名字；这不会改变产品，但会改变谁被记住。","choices":["接受并亲自承担这个交换，项目结果更重要。","拒绝新的名誉条件，即使关系因此恶化。","给予与真实贡献相称的署名，但拒绝永久性突出。","把署名标准交给团队和公开规则统一处理。"],"mode":"P","follow":1},{"id":"f049","parent":"q048","title":"复制体要求拥有你的人际关系","theme":"记忆与人格","structure":"责任转移","axis":"identity","story":"拥有你完整记忆的复制体醒来后说：既然它记得你爱过谁、答应过谁，它也应该拥有进入这些关系的权利。那些人并没有为“两个你”做过准备。","choices":["主动承担身份冲突，明确哪些关系只能由原来的你继续。","承认复制体拥有同等身份权，允许它进入原有关系。","把共同记忆与现实关系分开，让每段关系重新从当事人同意开始。","让相关的人分别决定是否与复制体建立新的关系。"],"mode":"P","follow":1},{"id":"f050","parent":"q094","title":"发明第一次造成伤害，也第一次救了人","theme":"创造与责任","structure":"责任转移","axis":"responsibility","story":"你的双重用途发明几乎同时出现两个结果：一处被滥用造成严重伤害，另一处却因此救下很多人。两边都无法简单归因于你的直接决定。","choices":["继续承担技术方向，主动推动更强限制和安全设计。","因为伤害已经发生，停止继续推广。","保留有明确公共价值的用途，同时封锁高风险能力。","交给独立监管与使用许可制度决定哪些场景能继续。"],"mode":"P","follow":1}];

function pairScore(a,b,role){const x=a.rel,y=b.rel,sim=(u,v)=>1-Math.abs(u-v),sat=(v,t=.8)=>Math.min(v/t,1);
 if(role==='friend'){
  const compat=.20*sim(x.warm,y.warm)+.16*sim(x.playful,y.playful)+.12*sim(x.principled,y.principled)+.10*sim(x.intense,y.intense)+.08*sim(x.dominant,y.dominant);
  const reliability=.12*sat(y.loyal,.82)+.08*sat(y.steady,.82)+.06*sat(y.warm,.82);
  const targetSteady=Math.min(.85,x.steady+.18*(1-x.steady)),targetWarm=Math.min(.90,x.warm+.12*(1-x.warm));
  const complement=.04*(1-Math.abs(y.steady-targetSteady))+.04*(1-Math.abs(y.warm-targetWarm));
  const fragility=.06*Math.max(0,.55-y.loyal)+.04*Math.max(0,.50-y.steady);
  return compat+reliability+complement-fragility
 }
 if(role==='lover')return .22*(1-Math.abs(x.warm-y.warm))+.20*(1-Math.abs(x.steady-y.steady))+.20*(1-Math.abs(x.intense-y.intense))+.13*(1-Math.abs(x.playful-y.playful))+.10*(1-Math.abs(x.loyal-y.loyal))+.09*(1-Math.abs(x.dominant+y.dominant-.95))+.06*y.loyal;
 if(role==='partner'){
  const targetDominant=Math.max(.45,Math.min(.82,.92-.62*x.dominant)),targetJudgment=Math.min(.95,x.judgment+.22*(1-x.judgment)),targetCourage=Math.min(.92,x.courage+.20*(1-x.courage));
  const core=.20*(1-Math.abs(y.dominant-targetDominant))+.18*(1-Math.abs(y.judgment-targetJudgment))+.14*(1-Math.abs(y.courage-targetCourage))+.12*sim(x.principled,y.principled)+.08*sim(x.intense,y.intense);
  const readiness=.10*sat(y.steady,.82)+.08*sat(y.loyal,.80)+.06*sat(y.judgment,.85);
  const clash=.06*Math.max(0,x.dominant+y.dominant-1.45)+.05*Math.abs(x.principled-y.principled)*Math.max(x.intense,y.intense);
  const fragility=.05*Math.max(0,.50-y.steady)+.04*Math.max(0,.45-y.loyal);
  return core+readiness-clash-fragility
 }
 if(role==='mentor'){
  const tj=Math.min(.95,x.judgment+.30*(1-x.judgment)),ts=Math.min(.94,x.steady+.26*(1-x.steady)),tp=Math.min(.95,x.principled+.24*(1-x.principled)),tc=Math.min(.90,x.courage+.18*(1-x.courage)),tw=Math.min(.88,x.warm+.12*(1-x.warm));
  const fit=.22*(1-Math.abs(y.judgment-tj))+.18*(1-Math.abs(y.steady-ts))+.16*(1-Math.abs(y.principled-tp))+.10*(1-Math.abs(y.courage-tc))+.07*(1-Math.abs(y.warm-tw))+.07*sim(x.playful,y.playful);
  const readiness=.07*sat(y.judgment,.82)+.06*sat(y.steady,.82)+.05*sat(y.principled,.82);
  const maturity=(y.judgment+y.steady+y.principled)/3;
  const qualification=.12*Math.max(0,.68-maturity)+.08*Math.max(0,.58-y.principled)+.05*Math.max(0,.55-y.steady);
  const extreme=.05*Math.max(0,y.dominant-.82)+.06*Math.max(0,y.intense-.82)+.07*Math.max(0,.35-y.warm);
  return fit+readiness-qualification-extreme
 }
 return 0}
function roleList(role){const anchors=topCharacters(role==='lover'?3:8),pool=role==='lover'?CHARACTERS.filter(c=>genderOf(c)!==state.userGender):CHARACTERS;return pool.map(c=>{let s=0;for(const a of anchors)s+=a.p*pairScore(a.c,c,role);return{c,score:s}}).sort((a,b)=>b.score-a.score)}

function roundedRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}

function wrapCanvas(ctx,text,maxWidth){const lines=[];let line='';for(const ch of String(text)){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);return lines}
function drawWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){const lines=wrapCanvas(ctx,text,maxWidth).slice(0,maxLines);lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));return y+lines.length*lineHeight}
